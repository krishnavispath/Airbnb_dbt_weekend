models:
  - name: dim_listings_cleansed
    description: "This table contains cleansed and validated listing data from Airbnb."
    data_tests:
      - minimum_row_count:
          arguments:
            min_rows: 18000
    columns:
      - name: listing_id
        description: "Primary key for the listing."
        data_tests:
          - not_null
          - unique

      - name: host_id
        description: "Foreign key referencing the host."
        data_tests:
          - not_null
          - dbt_utils.relationships_where:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        description: "Type of room being listed."
        data_tests:
          - accepted_values:
              values: ['Entire home/apt', 'Private room', 'Shared room', 'Hotel room']

      - name: minimum_nights
        description: '{{ doc("dim_listings_cleansed_minimum_nights") }}'
        data_tests:
          - positive_values

  - name: dim_hosts_cleansed
    description: "This table contains cleansed and validated host data from Airbnb."
    config:
      contract:
        enforced: true
    columns:
      - name: host_id
        description: "Primary key for the host."
        data_type: integer
      - name: host_name
        description: "Name of the host."
        data_type: string
      - name: is_superhost
        description: "Indicates if the host is a superhost."
        data_type: boolean
      - name: updated_at
        description: "Timestamp of the last update."
        data_type: timestamp
      - name: created_at
        description: "Timestamp of when the host was created."
        data_type: timestamp
  - name: dim_listings_w_hosts
    data_tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          arguments:
            compare_model: source('my_airbnb', 'my_listings')
    columns:
      - name: price
        description: "Price of the listing."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments:
                column_type: number
          - dbt_expectations.expect_column_quantile_values_to_be_between:
              arguments:
                quantile: 0.99 
                min_value: 50
                max_value: 500
          - dbt_expectations.expect_column_max_to_be_between:
              arguments:
                max_value: 5000
              config:
                severity: warn