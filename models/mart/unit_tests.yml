unit_tests:
  - name: unittest_fullmoon_matcher
    model: mart_fullmoon_reviews
    given:
      - input: ref('fct_reviews')
        rows:
          - {review_date: '2020-03-08'}
          - {review_date: '2020-03-09'}
          - {review_date: '2020-03-10'}
      - input: ref('seed_full_moon_dates')
        rows:
          - {full_moon_date: '2020-03-09'}
    expect:
      rows:
        - {review_date: '2020-03-08', is_full_moon: "not full moon"}
        - {review_date: '2020-03-09', is_full_moon: "not full moon"}
        - {review_date: '2020-03-10', is_full_moon: "full moon"}